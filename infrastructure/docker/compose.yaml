services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: jarvis
      POSTGRES_USER: jarvis_owner
      POSTGRES_PASSWORD: jarvis_dev_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis_owner -d jarvis"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - jarvis-postgres:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro

volumes:
  jarvis-postgres:

